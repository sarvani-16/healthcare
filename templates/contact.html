{% extends "base.html" %}

{% block title %}Contact - VitalSign{% endblock %}

{% block content %}

<div class="container">

    <div class="page-header">

        <h2>
            Contact Us
        </h2>

        <p>
            Get in touch with the VitalSign team.
        </p>

        <div class="red-line"></div>

    </div>


    <div class="form-container">

        <div class="form-grid">


            <div class="form-group">

                <label>
                    Name
                </label>

                <input type="text"
                       placeholder="Enter your name">

            </div>


            <div class="form-group">

                <label>
                    Email
                </label>

                <input type="email"
                       placeholder="Enter your email">

            </div>


            <div class="form-group full">

                <label>
                    Subject
                </label>

                <input type="text"
                       placeholder="Enter subject">

            </div>


            <div class="form-group full">

                <label>
                    Message
                </label>

                <textarea
                    placeholder="Enter your message">
                </textarea>

            </div>

        </div>


        <div style="text-align:center;
                    margin-top:25px;">

            <button class="btn btn-primary">

                <i class="fa-solid fa-paper-plane"></i>

                Send Message

            </button>

        </div>

    </div>

</div>

{% endblock %}
